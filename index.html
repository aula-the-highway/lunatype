<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Lunatype - digite ouvindo música</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c0a1d; --plum:#1b1238; --dusk:#2a1d55; --orchid:#b794ff; --pink:#ff7ab8; --aqua:#63e6f2;
  --cream:#f1ebff; --mute:#9d95c8; --line:rgba(183,148,255,.22); --bad:#ff5d8f; --gold:#ffd77a;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{background:var(--ink);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;color:var(--cream);
  font:400 16px/1.55 'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:
    radial-gradient(900px 520px at 8% -8%,rgba(255,122,184,.17),transparent 60%),
    radial-gradient(820px 620px at 100% 100%,rgba(99,230,242,.12),transparent 60%),
    linear-gradient(180deg,#0c0a1d,#150d2c 70%,#0c0a1d);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.65;
  background-image:
    radial-gradient(1.2px 1.2px at 20px 30px,rgba(255,255,255,.75),transparent),
    radial-gradient(1px 1px at 120px 80px,rgba(255,255,255,.5),transparent),
    radial-gradient(1.5px 1.5px at 220px 160px,rgba(183,148,255,.85),transparent),
    radial-gradient(1px 1px at 60px 210px,rgba(255,255,255,.4),transparent),
    radial-gradient(1.2px 1.2px at 260px 40px,rgba(99,230,242,.65),transparent),
    radial-gradient(1px 1px at 170px 235px,rgba(255,122,184,.6),transparent);
  background-size:300px 260px;
}
#app{position:relative;z-index:1}
h1,h2,h3{font-family:'Syne','DM Sans',sans-serif;margin:0;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}

.glass{background:rgba(27,18,56,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px}
.pad{padding:22px}
.sub{color:var(--mute)}

/* botões e campos */
.btn{font:700 15px 'DM Sans',sans-serif;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--cream);padding:10px 18px;border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{background:rgba(255,255,255,.1);border-color:var(--orchid)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.pri{background:linear-gradient(135deg,var(--pink),var(--orchid));color:#1a0f33;border:0}
.btn.pri:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.sm{padding:6px 13px;font-size:13px}
.btn.danger{border-color:rgba(255,93,143,.5);color:var(--bad)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--mute)}
input[type=text],input[type=password],textarea{width:100%;background:rgba(8,6,20,.62);border:1px solid var(--line);color:var(--cream);padding:12px 14px;border-radius:14px;font:inherit}
input::placeholder,textarea::placeholder{color:#6f6899}
input:focus,textarea:focus{outline:none;border-color:var(--orchid);box-shadow:0 0 0 3px rgba(183,148,255,.22)}
textarea.lyr-in{min-height:170px;resize:vertical;font-family:'JetBrains Mono',monospace;font-size:14px}
.msg{min-height:22px;font-size:14px;color:var(--bad);margin:2px 0 10px}
.msg.ok{color:var(--aqua)}

/* login */
.auth{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;padding:24px}
.moon{position:absolute;right:max(-120px,-8vw);top:-90px;width:min(78vw,520px);aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle at 62% 28%,rgba(120,90,190,.35) 0 7%,transparent 8%),
    radial-gradient(circle at 30% 62%,rgba(120,90,190,.28) 0 11%,transparent 12%),
    radial-gradient(circle at 70% 70%,rgba(120,90,190,.25) 0 5%,transparent 6%),
    radial-gradient(circle at 36% 30%,#fffafd 0%,#f2dcff 30%,#c8a8ff 62%,#7d5fdc 100%);
  box-shadow:0 0 90px 24px rgba(183,148,255,.35),0 0 260px 90px rgba(255,122,184,.16)}
.auth-card{position:relative;width:min(440px,100%);padding:30px 28px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:40px;font-weight:800}
.brand-mark{font-size:34px;color:var(--orchid);text-shadow:0 0 18px rgba(183,148,255,.8)}
.auth-card .lead{margin:6px 0 2px;color:var(--cream)}
.typer-line{color:var(--pink);min-height:26px;font-weight:500;margin-bottom:18px}
#typer::after{content:"▍";color:var(--aqua);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tabs{display:flex;gap:6px;margin:0 0 18px;padding:4px;background:rgba(8,6,20,.55);border-radius:999px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font-weight:700;padding:9px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:linear-gradient(135deg,rgba(255,122,184,.9),rgba(183,148,255,.9));color:#1a0f33}
.notice{border:1px dashed var(--orchid);border-radius:16px;padding:16px;margin-bottom:18px;background:rgba(183,148,255,.08)}
.notice h3{font-size:17px;margin-bottom:4px}
.notice p{font-size:14px;color:var(--mute);margin-bottom:12px}
.status{margin-top:14px;font-size:13px;color:var(--mute);text-align:center}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avs button{font-size:22px;padding:8px 0;border-radius:14px;border:1px solid var(--line);background:rgba(8,6,20,.5);cursor:pointer}
.avs button[aria-pressed=true]{border-color:var(--aqua);background:rgba(99,230,242,.14);box-shadow:0 0 0 2px rgba(99,230,242,.25)}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 22px;background:rgba(12,10,29,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .logo{font:800 22px 'Syne',sans-serif;display:flex;gap:8px;align-items:center;margin-right:8px}
.top .logo i{font-style:normal;color:var(--orchid);text-shadow:0 0 14px rgba(183,148,255,.8)}
.nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.nav button{background:none;border:0;color:var(--mute);font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer}
.nav button:hover{color:var(--cream)}
.nav button[aria-current=page]{color:#1a0f33;background:linear-gradient(135deg,var(--pink),var(--orchid))}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--cream);padding:5px 14px 5px 8px;border-radius:999px;cursor:pointer;font-weight:700}
.chip .av{font-size:20px}
.chip small{color:var(--aqua);font-weight:500}
.wrap{max-width:1080px;margin:0 auto;padding:26px 22px 60px}

/* mapa de fases */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hello h2{font-size:clamp(28px,4vw,42px);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(5,1fr);margin-bottom:34px}
.stats>div{padding:16px 10px;text-align:center;border-right:1px solid var(--line)}
.stats>div:last-child{border-right:0}
.stats b{display:block;font:800 26px 'Syne',sans-serif}
.stats span{font-size:13px;color:var(--mute)}
.world{--c:#63e6f2;margin-bottom:38px}
.world>header{display:flex;align-items:center;gap:14px}
.world .glyph{font-size:34px;filter:drop-shadow(0 0 12px var(--c))}
.world h3{font-size:24px;font-weight:700;color:var(--c)}
.world header p{color:var(--mute);font-size:14px}
.wprog{margin-left:auto;font-size:13px;color:var(--mute);white-space:nowrap}
.path{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:22px 0 26px}
.path::before{content:"";position:absolute;left:8%;right:8%;top:54px;height:2px;opacity:.4;background:repeating-linear-gradient(90deg,var(--c) 0 6px,transparent 6px 14px)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--cream);cursor:pointer;padding:0}
.node:nth-child(even) .orb{transform:translateY(16px)}
.node:nth-child(even) .stars{transform:translateY(16px)}
.orb{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font:800 22px 'Syne',sans-serif;
  border:2px solid color-mix(in srgb,var(--c) 70%,transparent);
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 38%,#1b1238),#1b1238);
  box-shadow:0 0 22px color-mix(in srgb,var(--c) 32%,transparent);transition:transform .18s,box-shadow .18s}
.node:hover .orb{box-shadow:0 0 34px color-mix(in srgb,var(--c) 60%,transparent)}
.node.done .orb{background:var(--c);color:#150f2e}
.node.locked{cursor:not-allowed}
.node.locked .orb{filter:grayscale(1) brightness(.55);box-shadow:none;font-size:18px}
.node.boss .orb{width:76px;height:76px;margin-top:-5px;outline:2px dashed color-mix(in srgb,var(--c) 70%,transparent);outline-offset:5px}
.stars{font-size:14px;letter-spacing:2px;color:var(--gold);min-height:20px}
.node.locked .stars{color:#4a4470}

/* jogo */
.play-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ptitle{flex:1;min-width:180px}
.ptitle h2{font-size:24px}
.ptitle p{color:var(--mute);font-size:14px}
.hud{display:flex;gap:22px}
.hud div{text-align:center}
.hud b{display:block;font:800 28px 'Syne',sans-serif;line-height:1.1}
.hud span{font-size:12px;color:var(--mute)}
.play-grid{display:grid;gap:18px}
.play-grid.with-player{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.stagewrap{border:1px solid var(--line);border-radius:26px;background:rgba(14,10,32,.6);overflow:hidden}
.bar{height:4px;background:rgba(255,255,255,.06)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--aqua),var(--pink));transition:width .15s}
.stage{position:relative;height:clamp(270px,44vh,390px);overflow:hidden;cursor:text;
  -webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.lyr{position:relative;padding:0 5%;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.ln{font:600 clamp(17px,2.5vw,29px)/1.55 'JetBrains Mono',ui-monospace,monospace;text-align:center;white-space:pre-wrap;padding:6px 0;opacity:.2;transition:opacity .3s}
.ln[data-s=now]{opacity:1}
.ln[data-s=past]{opacity:.4}
.ln[data-s=next][data-d="1"]{opacity:.62}
.ln[data-s=next][data-d="2"]{opacity:.34}
.c{color:rgba(241,235,255,.32);border-radius:3px}
.c.ok{color:var(--cream)}
.ln[data-s=now] .c.ok{text-shadow:0 0 16px rgba(183,148,255,.75)}
.c.bad{color:var(--bad);background:rgba(255,93,143,.2)}
.c.cur{background:rgba(99,230,242,.16);box-shadow:inset 0 -3px 0 var(--aqua);animation:caret 1.1s ease-in-out infinite}
@keyframes caret{50%{background:rgba(99,230,242,.04)}}
.c.sp{display:inline-block;width:1ch}
#cap{position:absolute;inset:0;width:100%;height:100%;opacity:0;resize:none;border:0;padding:0;font-size:16px;cursor:text;z-index:2}
.hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:var(--aqua);font-size:14px;pointer-events:none;z-index:1}
.stage.blur .hint::before{content:"Clique aqui para continuar. "}
.play-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.play-foot .req{margin-left:auto;font-size:13px;color:var(--mute)}
.pcard{padding:16px}
.pcard h3{font-size:17px;margin-bottom:2px}
.pcard iframe{width:100%;border:0;border-radius:14px;margin:12px 0;background:#000}
.pcard iframe.yt{aspect-ratio:16/9}
.pcard iframe.sp{height:152px}
.pcard .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pcard a,.lk{color:var(--aqua);font-size:14px}
.pcard .note{font-size:13px;color:var(--mute);margin-top:8px}

/* resultado */
.bigstars{font-size:46px;letter-spacing:8px;color:var(--gold);text-align:center;text-shadow:0 0 22px rgba(255,215,122,.6);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.bigstars .off{color:#4a4470;text-shadow:none}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;text-align:center}
.rgrid b{display:block;font:800 26px 'Syne',sans-serif}
.rgrid span{font-size:12px;color:var(--mute)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}

/* músicas */
.res-list{display:grid;gap:8px;margin-top:8px}
.res{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(8,6,20,.45)}
.res .t{flex:1;min-width:0}
.res .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .t span{font-size:13px;color:var(--mute)}
details.custom{margin-top:16px;border:1px solid var(--line);border-radius:18px;padding:4px 18px 18px;background:rgba(27,18,56,.4)}
details.custom summary{cursor:pointer;font-weight:700;padding:14px 0}
h3.sec{font-size:20px;margin:28px 0 10px}

/* ranking */
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:rgba(8,6,20,.55);margin:14px 0 18px}
.seg button{border:0;background:none;color:var(--mute);font-weight:700;padding:8px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:linear-gradient(135deg,var(--pink),var(--orchid));color:#1a0f33}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rk{display:grid;grid-template-columns:44px 40px 1fr auto auto;gap:12px;align-items:center;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(27,18,56,.5)}
.rk.me{border-color:var(--aqua);box-shadow:0 0 0 1px rgba(99,230,242,.35),0 0 24px rgba(99,230,242,.12)}
.rk .pos{font:800 22px 'Syne',sans-serif;color:var(--mute);text-align:center}
.rk.p1 .pos{color:var(--gold)}.rk.p2 .pos{color:#d5d9ee}.rk.p3 .pos{color:#e6a171}
.rk .av{font-size:26px;text-align:center}
.rk .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.rk .meta{font-size:13px;color:var(--mute)}
.rk .val{font:800 20px 'Syne',sans-serif;color:var(--aqua);min-width:90px;text-align:right}

/* master */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:rgba(27,18,56,.45)}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th,.tbl td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
.tbl th{color:var(--mute);font-weight:500}
.tbl tr:last-child td{border-bottom:0}
.tbl .acts{display:flex;gap:6px;flex-wrap:wrap}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}
.toolbar .field{margin:0;flex:1;min-width:200px}
.empty{padding:34px 16px;text-align:center;color:var(--mute)}

/* modal e toast */
.mwrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;overflow:auto;background:rgba(6,4,16,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mbox{width:min(520px,100%);padding:26px;background:rgba(27,18,56,.96)}
.mbox h3{font-size:22px;margin-bottom:6px}
.mbox>p{color:var(--mute);margin-bottom:16px;font-size:15px}
.mbox .mrow{justify-content:flex-end;margin-top:16px}
.tmp{font:600 22px 'JetBrains Mono',monospace;text-align:center;padding:14px;border-radius:14px;background:rgba(8,6,20,.7);border:1px dashed var(--aqua);color:var(--aqua);margin:12px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:rgba(27,18,56,.96);border:1px solid var(--orchid);padding:10px 18px;border-radius:999px;font-size:14px;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.err{border-color:var(--bad)}

@media (max-width:720px){
  .top{padding:10px 14px}
  .wrap{padding:20px 14px 50px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stats>div:nth-child(3){border-right:0}
  .stats>div:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .path{grid-template-columns:repeat(3,1fr);row-gap:28px}
  .path::before{display:none}
  .play-grid.with-player{grid-template-columns:1fr}
  .rk{grid-template-columns:34px 32px 1fr auto;gap:8px}
  .rk .meta{display:none}
  .hud{gap:14px}
  .hud b{font-size:22px}
  .world header{flex-wrap:wrap}
  .wprog{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- armazenamento (banco online ou local) ---------- */
const Store=(function(){
  let db=null,mode='local';
  const mem={};
  const ls={
    get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]!==undefined?mem[k]:null}},
    set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},
    del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}},
    keys(){try{return Object.keys(localStorage)}catch(e){return Object.keys(mem)}}
  };
  const K=(c,i)=>'lt1:'+c+'/'+i;
  async function retry(fn){
    try{return await fn()}catch(e){
      if(e&&e.code==='unavailable'){await sleep(400+Math.random()*400);return await fn()}
      throw e;
    }
  }
  async function init(){
    try{
      if(window.claude&&typeof window.claude.use==='function'){
        const timeout=new Promise(r=>setTimeout(()=>r(null),7000));
        db=await Promise.race([window.claude.use('db'),timeout]);
        if(db)mode='cloud';
      }
    }catch(e){db=null}
    return mode;
  }
  async function get(c,i){
    if(mode==='cloud'){const s=await retry(()=>db.doc(c+'/'+i).get());return s.exists?clone(s.data()):null}
    const v=ls.get(K(c,i));return v?JSON.parse(v):null;
  }
  async function set(c,i,d){
    if(mode==='cloud'){await retry(()=>db.doc(c+'/'+i).set(clone(d)));return}
    ls.set(K(c,i),JSON.stringify(d));
  }
  async function del(c,i){
    if(mode==='cloud'){await retry(()=>db.doc(c+'/'+i).delete());return}
    ls.del(K(c,i));
  }
  function localList(c){
    const pre='lt1:'+c+'/';
    return ls.keys().filter(k=>k.startsWith(pre)).map(k=>{
      try{const d=JSON.parse(ls.get(k));d.id=k.slice(pre.length);return d}catch(e){return null}
    }).filter(Boolean);
  }
  function watch(c,cb){
    if(mode==='cloud'){
      return db.collection(c).limit(1000).onSnapshot(
        snap=>cb(snap.docs.map(d=>Object.assign({id:d.id},clone(d.data())))),
        err=>console.error('watch',c,err));
    }
    let last='';
    const tick=()=>{const l=localList(c);const s=JSON.stringify(l);if(s!==last){last=s;cb(l)}};
    tick();
    const t=setInterval(tick,2500);
    return ()=>clearInterval(t);
  }
  return{init,get,set,del,watch,get mode(){return mode}};
})();

const b64=u8=>btoa(String.fromCharCode.apply(null,u8));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function newSalt(){
  const a=new Uint8Array(16);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);
  return b64(a);
}
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:80000,hash:'SHA-256'},key,256);
    return b64(new Uint8Array(bits));
  }
  let h1=0xdeadbeef,h2=0x41c6ce57;const s=salt+'|'+pw;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'f'+(h2>>>0).toString(16)+(h1>>>0).toString(16);
}

function recompute(p){
  let pts=0,st=0,ph=0,best=0,sp=0;
  for(const k in p.progress){const r=p.progress[k];pts+=r.pts||0;st+=r.stars||0;if((r.stars||0)>0)ph++;best=Math.max(best,r.wpm||0)}
  for(const k in p.songs){const r=p.songs[k];sp+=r.pts||0;best=Math.max(best,r.wpm||0)}
  p.points=pts+sp;p.songPoints=sp;p.stars=st;p.phases=ph;p.bestWpm=Math.round(best*10)/10;
}

async function register(username,pw,pw2,avatar){
  const u=normUser(username);
  if(!/^[a-z0-9_-]{3,20}$/.test(u))throw new Error('Use de 3 a 20 letras, números, _ ou -, sem acentos.');
  if(RESERVED.includes(u))throw new Error('Esse nome é reservado. Escolha outro.');
  if(pw.length<4)throw new Error('A senha precisa ter pelo menos 4 caracteres.');
  if(pw!==pw2)throw new Error('As senhas não são iguais.');
  if(await Store.get('accounts',u))throw new Error('Esse nome já está em uso. Escolha outro.');
  const salt=newSalt();
  await Store.set('accounts',u,{username:u,salt,hash:await hashPw(pw,salt),role:'student',mustChange:false,createdAt:Date.now()});
  const chk=await Store.get('accounts',u);
  if(!chk||chk.salt!==salt)throw new Error('Esse nome acabou de ser usado por outra pessoa. Escolha outro.');
  await Store.set('players',u,newPlayer(u,avatar));
  return{username:u,role:'student',mustChange:false};
}
async function login(username,pw){
  if(Date.now()<lockUntil)throw new Error('Muitas tentativas. Aguarde '+Math.ceil((lockUntil-Date.now())/1000)+'s.');
  const u=normUser(username);
  const acc=u?await Store.get('accounts',u):null;
  const ok=acc&&(await hashPw(pw,acc.salt))===acc.hash;
  if(!ok){fails++;if(fails>=5){lockUntil=Date.now()+15000;fails=0}throw new Error('Usuário ou senha incorretos.')}
  fails=0;
  return{username:u,role:acc.role,mustChange:!!acc.mustChange};
}
async function changePw(u,oldPw,newPw,skipOld){
  const acc=await Store.get('accounts',u);
  if(!acc)throw new Error('Conta não encontrada.');
  if(!skipOld&&(await hashPw(oldPw,acc.salt))!==acc.hash)throw new Error('A senha atual está incorreta.');
  const min=acc.role==='master'?6:4;
  if(newPw.length<min)throw new Error('A nova senha precisa ter pelo menos '+min+' caracteres.');
  const salt=newSalt();
  await Store.set('accounts',u,Object.assign({},acc,{salt,hash:await hashPw(newPw,salt),mustChange:false,updatedAt:Date.now()}));
}
async function enter(session){
  state.session=session;sessSave(session);

function cleanLyrics(raw){
  let lines=String(raw||'').replace(/\r/g,'').split('\n').map(l=>l
    .replace(/[\u200B-\u200D\uFEFF]/g,'')
    .replace(/[\u2018\u2019\u201B]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/\u00A0/g,' ')
    .replace(/\p{Extended_Pictographic}/gu,'')
    .replace(/\s+/g,' ').trim()
  ).filter(l=>l&&!/^\[.*\]$/.test(l));
  let total=0;const out=[];
  for(const l of lines){if(total+l.length+1>6000)break;out.push(l);total+=l.length+1}
  return out;
}
function parseEmbed(u){
  u=(u||'').trim();if(!u)return null;let m;
  m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/)|music\.youtube\.com\/watch\?(?:[^#]*&)?v=)([\w-]{11})/);
  if(m)return{type:'yt',src:'https://www.youtube.com/embed/'+m[1]+'?rel=0&modestbranding=1',open:'https://www.youtube.com/watch?v='+m[1]};
  m=u.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/);
  if(m)return{type:'sp',src:'https://open.spotify.com/embed/'+m[1]+'/'+m[2],open:'https://open.spotify.com/'+m[1]+'/'+m[2]};
  if(/^https?:\/\//i.test(u))return{type:'link',open:u};
  return null;
}

function mountStage(){
  const c=state.play,lines=c.lines;
  const stage=$('#stage'),inner=$('#lyr'),ta=$('#cap');
  T={ctx:c,lines,target:lines.join(' '),typed:'',total:0,err:0,t0:null,t1:null,done:false,comp:false,active:0,spans:[],lnEls:[],lineOf:[],sp:[]};
  let html='';
  lines.forEach((ln,li)=>{
    html+='<div class="ln" data-i="'+li+'">';
    for(const ch of ln){html+='<span class="c">'+esc(ch)+'</span>';T.lineOf.push(li);T.sp.push(false)}
    if(li<lines.length-1){html+='<span class="c sp"> </span>';T.lineOf.push(li);T.sp.push(true)}
    html+='</div>';
  });
  inner.innerHTML=html;
  T.spans=$$('.c',inner);T.lnEls=$$('.ln',inner);
  paint(0,0,true);setActive(0);
  ta.addEventListener('beforeinput',e=>{
    if(T.done){e.preventDefault();return}
    const t=e.inputType||'';
    if(t==='insertFromPaste'||t==='insertFromDrop'||t==='insertFromYank'||t.indexOf('history')===0||t==='insertLineBreak'||t==='insertParagraph')e.preventDefault();
  });
  ['paste','drop','cut','copy','dragstart'].forEach(ev=>ta.addEventListener(ev,e=>e.preventDefault()));
  ta.addEventListener('keydown',e=>{
    if(['Enter','Tab','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].indexOf(e.key)>-1)e.preventDefault();
  });
  const pin=()=>{const n=ta.value.length;try{ta.setSelectionRange(n,n)}catch(e){}};
  ['select','mouseup','focus','keyup'].forEach(ev=>ta.addEventListener(ev,pin));
  ta.addEventListener('compositionstart',()=>{T.comp=true});
  ta.addEventListener('compositionend',()=>{T.comp=false;onInput(ta)});
  ta.addEventListener('input',()=>{if(!T.comp)onInput(ta)});
  ta.addEventListener('focus',()=>stage.classList.remove('blur'));
  ta.addEventListener('blur',()=>{if(!T.done)stage.classList.add('blur')});
  ta.focus();
  window.addEventListener('resize',center);
  requestAnimationFrame(center);
}
function paint(prev,now,all){
  const v=T.typed,g=T.target,S=T.spans;
  const from=all?0:Math.max(0,Math.min(prev,now)-1),to=all?S.length-1:Math.min(g.length-1,Math.max(prev,now));
  for(let i=from;i<=to;i++){
    const s=S[i];if(!s)continue;
    let cls='c'+(T.sp[i]?' sp':'');
    if(i<now)cls+=v[i]===g[i]?' ok':' bad';
    if(i===now)cls+=' cur';
    s.className=cls;
  }
  const li=now>=g.length?T.lines.length-1:T.lineOf[now];
  if(li!==T.active||all)setActive(li);
}
function setActive(li){
  T.active=li;
  T.lnEls.forEach((el,i)=>{el.dataset.s=i<li?'past':i===li?'now':'next';el.dataset.d=String(Math.min(3,Math.abs(i-li)))});
  center();
}
function center(){
  if(!T||!$('#stage'))return;
  const ln=T.lnEls[T.active];if(!ln)return;
  const h=$('#stage').clientHeight;
  $('#lyr').style.transform='translateY('+(h/2-(ln.offsetTop+ln.offsetHeight/2))+'px)';
}
let actx=null;
function blip(ok){
  if(!state.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type=ok?'triangle':'sawtooth';o.frequency.value=ok?520+Math.random()*140:130;
    o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(ok?0.03:0.04,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    o.start(t);o.stop(t+0.08);
  }catch(e){}
}
function onInput(ta){
  if(!T||T.done)return;
  let v=ta.value.replace(/[\r\n]+/g,'');
  if(v.length>T.target.length)v=v.slice(0,T.target.length);
  const prev=T.typed.length;
  if(v.length>prev){
    if(!T.t0){T.t0=performance.now();startTicker();const h=$('#hint');if(h)h.style.display='none'}
    for(let i=prev;i<v.length;i++){T.total++;if(v[i]!==T.target[i])T.err++}
    blip(v[v.length-1]===T.target[v.length-1]);
  }
  T.typed=v;if(ta.value!==v)ta.value=v;
  paint(prev,v.length,false);
  updateHud();
  if(v===T.target)finish();
}
function liveStats(){
  const now=T.t1||performance.now(),sec=T.t0?(now-T.t0)/1000:0;
  let ok=0;for(let i=0;i<T.typed.length;i++)if(T.typed[i]===T.target[i])ok++;
  return{sec,ok,wpm:sec>2?(ok/5)/(sec/60):0,acc:T.total?(T.total-T.err)/T.total*100:100};
}
function updateHud(){
  if(!T||!$('#hWpm'))return;
  const s=liveStats();
  $('#hWpm').textContent=Math.round(s.wpm);
  $('#hAcc').textContent=Math.round(s.acc)+'%';
  $('#hTime').textContent=fmtTime(s.sec);
  $('#bar').style.width=(s.ok/T.target.length*100)+'%';
}
function startTicker(){stopTicker();tickTimer=setInterval(updateHud,250)}
function stopTicker(){if(tickTimer){clearInterval(tickTimer);tickTimer=null}}
function finish(){
  T.done=true;T.t1=performance.now();stopTicker();
  const sec=Math.max((T.t1-T.t0)/1000,0.5);
  const wpm=Math.min(250,(T.target.length/5)/(sec/60));
  const acc=T.total?(T.total-T.err)/T.total*100:100;
  updateHud();
  const c=state.play;
  if(c.kind==='phase')finishPhase(c.ph,wpm,acc,sec);else finishSong(c,wpm,acc,sec);
}
function evalStars(ph,wpm,acc){
  if(acc<ph.minAcc)return 0;
  let s=1;if(wpm>=ph.w[0])s=2;if(wpm>=ph.w[1]&&acc>=96)s=3;return s;
}
function resultHTML(top,wpm,acc,sec,extra,btns){
  return top+'<div class="rgrid"><div><b>'+Math.round(wpm)+'</b><span>ppm</span></div><div><b>'+Math.round(acc)+'%</b><span>precisão</span></div><div><b>'+fmtTime(sec)+'</b><span>tempo</span></div></div>'+extra+'<div class="mrow">'+btns+'</div>';
}
function finishPhase(ph,wpm,acc,sec){
  const s=evalStars(ph,wpm,acc),pts=s?s*100+Math.round(wpm*3):0;
  const old=state.player.progress[ph.id];
  let extra='',top;
  if(s>0){
    if(!old||pts>(old.pts||0)){
      state.player.progress[ph.id]={stars:Math.max(s,old?old.stars:0),wpm:Math.max(wpm,old?old.wpm:0),acc:Math.round(acc*10)/10,pts:Math.max(pts,old?old.pts||0:0)};
      if(old&&old.stars>s)state.player.progress[ph.id].stars=old.stars;
      savePlayer();
    }
    const first=!old||!old.stars;
    extra='<p style="text-align:center;color:var(--aqua)">+'+pts+' pontos'+(first?'. Nova fase concluída!':'')+'</p>';
    if(ph.boss)extra+='<p style="text-align:center;margin-top:6px">Mundo "'+esc(RAW[ph.world].name)+'" concluído.</p>';
    top='<h3 style="text-align:center">'+(s===3?'Perfeito!':s===2?'Muito bem!':'Fase concluída')+'</h3><div class="bigstars" role="img" aria-label="'+s+' de 3 estrelas">'+'★'.repeat(s)+'<span class="off">'+'★'.repeat(3-s)+'</span></div>';
    if(s<3)extra+='<p class="sub" style="text-align:center;margin-top:8px;font-size:14px">'+(s===1?'Para 2 estrelas: '+ph.w[0]+' ppm. ':'')+'Para 3 estrelas: '+ph.w[1]+' ppm com 96% de precisão.</p>';
  }else{
    top='<h3 style="text-align:center">Quase lá</h3><p class="sub" style="text-align:center;margin-top:8px">Sua precisão foi '+Math.round(acc)+'%. Para passar, você precisa de '+ph.minAcc+'%. Vá mais devagar e acerte cada letra.</p>';
  }
  const next=PHASES.find(x=>x.id===ph.id+1);
  const btns=(s>0&&next?'<button class="btn pri" data-act="nextPhase" data-id="'+next.id+'">Próxima fase</button>':'')+'<button class="btn'+(s>0&&next?'':' pri')+'" data-act="restart">'+(s>0?'Jogar de novo':'Tentar de novo')+'</button><button class="btn" data-act="nav" data-v="home">Voltar ao mapa</button>';
  modal(resultHTML(top,wpm,acc,sec,extra,btns),true);
}
function finishSong(c,wpm,acc,sec){
  const chars=T.target.length;
  const pts=Math.min(300,Math.round(chars/10*Math.pow(acc/100,2)));
  const old=state.player.songs[c.key];
  let extra;
  if(!old||pts>(old.pts||0)){
    if(Object.keys(state.player.songs).length<200||old){
      state.player.songs[c.key]={title:c.title,artist:c.sub||'',wpm:Math.max(wpm,old?old.wpm:0),acc:Math.round(acc*10)/10,pts:Math.max(pts,old?old.pts||0:0),at:Date.now()};
      savePlayer();
    }
    extra='<p style="text-align:center;color:var(--aqua)">+'+(pts-(old?old.pts||0:0))+' pontos no ranking</p>';
  }else extra='<p class="sub" style="text-align:center">Você já tem '+old.pts+' pontos nesta música. Supere o recorde para ganhar mais.</p>';
  const top='<h3 style="text-align:center">Música concluída</h3><p class="sub" style="text-align:center">'+esc(c.title)+'</p>';
  modal(resultHTML(top,wpm,acc,sec,extra,'<button class="btn pri" data-act="restart">Digitar de novo</button><button class="btn" data-act="nav" data-v="songs">Escolher outra música</button>'),true);
}
function beginPlay(ctx){closeModal();state.play=ctx;state.view='play';render()}
function startPhase(id){
  const ph=PHASES.find(x=>x.id===id);if(!ph)return;
  beginPlay({kind:'phase',ph,title:ph.title,sub:RAW[ph.world].name,lines:ph.lines});
}
function startSong(o){
  const lines=cleanLyrics(o.lyrics);
  const n=lines.join(' ').length;
  if(!o.title||!o.title.trim())throw new Error('Digite o nome da música.');
  if(n<20)throw new Error('Cole uma letra com pelo menos uma frase.');
  const key=norm(o.title+'|'+(o.artist||'')).replace(/[^a-z0-9]+/g,'-').slice(0,60);
  beginPlay({kind:'song',title:o.title.trim(),sub:(o.artist||'').trim(),lines,embed:parseEmbed(o.url),key});
}

/* ---------- contas e ações ---------- */
function accountModal(){
  const s=state.session,m=s.role==='master';
  modal('<h3>'+esc(s.username)+'</h3><p>'+(m?'Conta do professor.':'Escolha seu avatar ou troque a senha.')+'</p>'
   +(m?'':'<div class="field"><label>Avatar</label><div class="avs">'+AVATARS.map(a=>'<button type="button" data-act="setAv" data-a="'+a+'" aria-pressed="'+(a===state.player.avatar)+'" aria-label="Avatar '+a+'">'+a+'</button>').join('')+'</div></div>')
   +'<div class="field"><label for="op">Senha atual</label><input id="op" type="password" autocomplete="current-password"></div>'
   +'<div class="field"><label for="np">Nova senha</label><input id="np" type="password" autocomplete="new-password"></div>'
   +'<div class="msg" id="pwMsg" role="alert"></div>'
   +'<div class="mrow" style="justify-content:space-between"><button class="btn danger" data-act="logout">Sair</button><span style="display:flex;gap:8px"><button class="btn" data-act="closeModal">Fechar</button><button class="btn pri" data-act="savePw">Trocar senha</button></span></div>');
}
function forceChange(){
  modal('<h3>Crie sua nova senha</h3><p>O professor definiu uma senha temporária para você. Escolha uma senha só sua para continuar.</p>'
   +'<div class="field"><label for="fp1">Nova senha</label><input id="fp1" type="password" autocomplete="new-password" data-enter="btnForce"></div>'
   +'<div class="field"><label for="fp2">Repita a senha</label><input id="fp2" type="password" autocomplete="new-password" data-enter="btnForce"></div>'
   +'<div class="msg" id="fMsg" role="alert"></div><div class="mrow"><button class="btn pri" id="btnForce" data-act="forceSave">Salvar e continuar</button></div>',true);
}
function songFormModal(id){
  const s=id?state.songs.find(x=>x.id===id):null;
  modal('<h3>'+(s?'Editar música':'Adicionar música')+'</h3><p>Ela aparece na biblioteca de todos os alunos.</p>'
   +'<div class="field"><label for="sT">Nome da música</label><input id="sT" type="text" value="'+esc(s?s.title:'')+'"></div>'
   +'<div class="field"><label for="sA">Artista</label><input id="sA" type="text" value="'+esc(s?s.artist:'')+'"></div>'
   +'<div class="field"><label for="sU">Link do YouTube ou Spotify</label><input id="sU" type="text" placeholder="https://..." value="'+esc(s?s.url:'')+'"></div>'
   +'<div class="field"><label for="sL">Letra</label><textarea id="sL" class="lyr-in">'+esc(s?s.lyrics:'')+'</textarea></div>'
   +'<div class="msg" id="sMsg" role="alert"></div><div class="mrow"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="songSave" data-id="'+esc(id||'')+'">Salvar</button></div>');
}
function confirmModal(title,text,act,u,label){
  modal('<h3>'+esc(title)+'</h3><p>'+esc(text)+'</p><div class="mrow"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn danger" data-act="'+act+'" data-u="'+esc(u)+'">'+esc(label)+'</button></div>');
}

const H={
  authTab(el){state.authTab=el.dataset.t;render()},
  pickAv(el){state.regAvatar=el.dataset.a;$$('.avs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.a===state.regAvatar)))},
  async doLogin(el){
    const msg=$('#authMsg');msg.textContent='';
    try{await enter(await login($('#lu').value,$('#lp').value))}catch(e){msg.textContent=errMsg(e)}
  },
  async doRegister(el){
    const msg=$('#authMsg');msg.textContent='';
    try{await enter(await register($('#ru').value,$('#rp').value,$('#rp2').value,state.regAvatar))}catch(e){msg.textContent=errMsg(e)}
  },
  async setupMaster(el){
    const p1=$('#mp1').value,p2=$('#mp2').value;
    if(p1.length<6)throw new Error('A senha master precisa ter pelo menos 6 caracteres.');
    if(p1!==p2)throw new Error('As senhas não são iguais.');
    if(await Store.get('accounts','master'))throw new Error('O usuário master já existe.');
    const salt=newSalt();
    await Store.set('accounts','master',{username:'master',salt,hash:await hashPw(p1,salt),role:'master',mustChange:false,createdAt:Date.now()});
    state.masterMissing=false;toast('Usuário master criado.');
    await enter({username:'master',role:'master',mustChange:false});
  },
  nav(el){closeModal();state.view=el.dataset.v;render()},
  phase(el){
    const id=+el.dataset.id;
    if(!unlocked(id)){toast('Termine a fase anterior para liberar esta.');return}
    startPhase(id);
  },
  nextPhase(el){startPhase(+el.dataset.id)},
  restart(){beginPlay(state.play)},
  sound(el){state.sound=!state.sound;el.textContent='Som das teclas: '+(state.sound?'ligado':'desligado');const c=$('#cap');if(c)c.focus()},
  quit(){
    if(T&&T.typed.length>0&&!T.done){
      modal('<h3>Sair desta tentativa?</h3><p>O que você digitou até agora não será salvo.</p><div class="mrow"><button class="btn" data-act="closeModal">Continuar digitando</button><button class="btn danger" data-act="nav" data-v="'+(state.play.kind==='song'?'songs':'home')+'">Sair</button></div>');
    }else{state.view=state.play.kind==='song'?'songs':'home';render()}
  },
  closeModal(){closeModal();const c=$('#cap');if(c)c.focus()},
  account(){accountModal()},
  setAv(el){
    state.player.avatar=el.dataset.a;savePlayer();
    $$('#modal .avs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.a===state.player.avatar)));
    const av=$('.chip .av');if(av)av.textContent=state.player.avatar;
  },
  async savePw(){
    const msg=$('#pwMsg');msg.className='msg';msg.textContent='';
    try{await changePw(state.session.username,$('#op').value,$('#np').value,false);msg.className='msg ok';msg.textContent='Senha alterada.';$('#op').value='';$('#np').value=''}catch(e){msg.textContent=errMsg(e)}
  },
  async masterPw(){
    const msg=$('#pwMsg');msg.className='msg';msg.textContent='';
    try{await changePw('master',$('#op').value,$('#np').value,false);msg.className='msg ok';msg.textContent='Senha master alterada.';$('#op').value='';$('#np').value=''}catch(e){msg.textContent=errMsg(e)}
  },
  async forceSave(){
    const msg=$('#fMsg'),a=$('#fp1').value,b=$('#fp2').value;
    try{
      if(a!==b)throw new Error('As senhas não são iguais.');
      await changePw(state.session.username,'',a,true);
      state.session.mustChange=false;sessSave(state.session);closeModal();toast('Senha atualizada.');
    }catch(e){msg.textContent=errMsg(e)}
  },
  logout(){logout()},
  songPlay(el){
    const s=state.songs.find(x=>x.id===el.dataset.id);if(!s)return;
    startSong({title:s.title,artist:s.artist,url:s.url,lyrics:s.lyrics});
  },
  customStart(){
    const msg=$('#cMsg');msg.textContent='';
    try{startSong({title:$('#sq').value,artist:$('#cArtist').value,url:$('#cUrl').value,lyrics:$('#cLyrics').value})}catch(e){msg.textContent=errMsg(e)}
  },
  rankTab(el){state.rankTab=el.dataset.t;$$('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===state.rankTab)));paintRank()},
  mTab(el){state.masterTab=el.dataset.t;$$('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===state.masterTab)));paintMaster()},
  resetPw(el){
    const u=el.dataset.u,tmp='lua'+Math.floor(1000+Math.random()*9000);
    modal('<h3>Nova senha para '+esc(u)+'</h3><p>Defina uma senha temporária. No próximo acesso, o aluno será obrigado a criar uma senha nova.</p>'
     +'<div class="field"><label for="tp">Senha temporária</label><input id="tp" type="text" value="'+tmp+'" autocomplete="off"></div><div class="msg" id="tMsg" role="alert"></div>'
     +'<div class="mrow"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="doReset" data-u="'+esc(u)+'">Definir senha</button></div>');
  },
  async doReset(el){
    const u=el.dataset.u,tmp=$('#tp').value.trim();
    if(tmp.length<4){$('#tMsg').textContent='Use pelo menos 4 caracteres.';return}
    const acc=await Store.get('accounts',u);if(!acc)throw new Error('Conta não encontrada.');
    const salt=newSalt();
    await Store.set('accounts',u,Object.assign({},acc,{salt,hash:await hashPw(tmp,salt),mustChange:true,updatedAt:Date.now()}));
    modal('<h3>Senha redefinida</h3><p>Passe estes dados para o aluno. Ele vai trocar a senha no primeiro acesso.</p><div class="tmp">'+esc(u)+' / '+esc(tmp)+'</div><div class="mrow"><button class="btn pri" data-act="closeModal">Pronto</button></div>');
  },
  resetProg(el){confirmModal('Zerar progresso de '+el.dataset.u+'?','As fases, estrelas e pontos desse aluno voltam a zero. A senha continua a mesma.','doResetProg',el.dataset.u,'Zerar progresso')},
  async doResetProg(el){
    const u=el.dataset.u,p=await Store.get('players',u);if(!p)throw new Error('Aluno não encontrado.');
    p.progress={};p.songs={};recompute(p);p.updatedAt=Date.now();await Store.set('players',u,p);closeModal();toast('Progresso zerado.');
  },
  delStudent(el){confirmModal('Excluir '+el.dataset.u+'?','A conta e todo o progresso desse aluno serão apagados. Isso não pode ser desfeito.','doDel',el.dataset.u,'Excluir aluno')},
  async doDel(el){
    const u=el.dataset.u;await Store.del('accounts',u);await Store.del('players',u);
    state.players=state.players.filter(p=>p.id!==u);closeModal();paintMaster();toast('Aluno excluído.');
  },
  songForm(el){songFormModal(el.dataset.id||'')},
  async songSave(el){
    const msg=$('#sMsg'),title=$('#sT').value.trim(),lyrics=$('#sL').value;
    if(!title){msg.textContent='Digite o nome da música.';return}
    if(cleanLyrics(lyrics).join(' ').length<20){msg.textContent='Cole uma letra com pelo menos uma frase.';return}
    const id=el.dataset.id||rid();
    await Store.set('songs',id,{id,title,artist:$('#sA').value.trim(),url:$('#sU').value.trim(),lyrics,createdAt:Date.now()});
    closeModal();toast('Música salva na biblioteca.');
  },
  songDel(el){confirmModal('Remover música?','Ela some da biblioteca de todos os alunos.','doSongDel',el.dataset.id,'Remover')},
  async doSongDel(el){await Store.del('songs',el.dataset.u);closeModal();toast('Música removida.')}
};

document.addEventListener('click',e=>{
  const w=e.target.classList&&e.target.classList.contains('mwrap')?e.target:null;
  if(w&&!w.hasAttribute('data-lock')){closeModal();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=H[el.dataset.act];if(!fn)return;
  if(el.disabled)return;
  const isBtn=el.tagName==='BUTTON';
  if(isBtn&&el.classList.contains('pri'))el.disabled=true;
  Promise.resolve().then(()=>fn(el,e)).catch(err=>toast(errMsg(err),'err')).finally(()=>{if(isBtn&&document.body.contains(el))el.disabled=false});
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.dataset&&e.target.dataset.enter){
    const b=document.getElementById(e.target.dataset.enter);if(b){e.preventDefault();b.click()}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='sq'||e.target.id==='cArtist')paintSongResults()});

/* ---------- render ---------- */
function render(){
  stopTicker();if(typerTimer){clearInterval(typerTimer);typerTimer=null}
  window.removeEventListener('resize',center);
  const app=$('#app');
  if(state.view!=='play')T=null;
  if(!state.session){app.innerHTML=authView();mountAuth();return}
  let body='';
  switch(state.view){
    case 'home':body=homeView();break;
    case 'songs':body=songsView();break;
    case 'rank':body=rankView();break;
    case 'master':body=masterView();break;
    case 'play':body=playView();break;
    default:body=homeView();
  }
  app.innerHTML=(state.view==='play'?topbarPlay():topbar())+'<main class="wrap">'+body+'</main>';
  window.scrollTo(0,0);
  if(state.view==='play')mountStage();
  else if(state.view==='songs')paintSongResults();
  else if(state.view==='rank')paintRank();
  else if(state.view==='master')paintMaster();
}
function topbarPlay(){return topbar()}

/* ---------- início ---------- */
async function boot(){
  $('#app').innerHTML='<div class="auth"><p class="sub">Conectando ao banco de dados...</p></div>';
  state.mode=await Store.init();
  try{
    const acc=await Store.get('accounts','master');
    state.masterMissing=!acc;
  }catch(e){state.masterMissing=false;toast(errMsg(e),'err')}
  let owner=null;
  try{
    if(state.mode==='cloud'&&window.claude&&window.claude.use){
      const u=await Promise.race([window.claude.use('user'),sleep(3000).then(()=>null)]);
      owner=u&&typeof u.isOwner==='function'?u.isOwner():null;
    }
  }catch(e){}
  state.canSetup=state.mode==='local'||owner===null||owner===true;
  const s=sessLoad();
  if(s){
    try{
      const acc=await Store.get('accounts',s.username);
      if(acc){await enter({username:s.username,role:acc.role,mustChange:!!acc.mustChange});return}
    }catch(e){}
  }
  render();
}
window.__lunatype={state,Store,PHASES,cleanLyrics,parseEmbed,boot};
boot();
})();
</script>
